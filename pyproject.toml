[project]
name = "delivery-prediction-ml"
version = "1.1.0"
description = "Late-delivery prediction on the Olist e-commerce dataset, with temporal evaluation, a FastAPI service and a distribution-shift study."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite rodar `pytest` diretamente (além de `python -m pytest`)
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
